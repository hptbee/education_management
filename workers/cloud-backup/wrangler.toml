name = "classroom-cloud-backup"
main = "src/index.ts"
compatibility_date = "2024-08-15"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "education-2302"
preview_bucket_name = "education-2302"

[[d1_databases]]
binding = "DB"
database_name = "classroom-app"
database_id = "4c53a22f-957b-4411-8ef0-a6673a5c17c7"
migrations_dir = "migrations"

[vars]
DEFAULT_TRIAL_DAYS = "7"
# Optional — worker derives verify key from ENTITLEMENT_PRIVATE_KEY if omitted
ENTITLEMENT_PUBLIC_KEY = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEASva/xyyJL7QpLnWAh3hH6hKb+1DY3GyT9N2ch63ou8c=\n-----END PUBLIC KEY-----"
# Google OAuth — Web application client (browser / `npm run dev`)
# GOOGLE_CLIENT_ID = ""
# Desktop app client (Tauri exe PKCE) — optional if different from web
# GOOGLE_CLIENT_ID_DESKTOP = ""
# Optional desktop client secret — set via wrangler secret put (required for most Desktop app clients)
# GOOGLE_CLIENT_SECRET = ""
# INITIAL_ADMIN_GOOGLE_SUB = ""
# CORS_ALLOWED_ORIGINS = "https://app.example.com,http://localhost:3000"  # optional; unset = *

# Secrets (wrangler secret put):
# ENTITLEMENT_PRIVATE_KEY — Ed25519 PKCS#8 PEM
# GOOGLE_CLIENT_ID — Web application OAuth client (same as NEXT_PUBLIC_GOOGLE_CLIENT_ID)
# GOOGLE_CLIENT_ID_DESKTOP — Desktop app client (same as NEXT_PUBLIC_GOOGLE_CLIENT_ID_DESKTOP)
# GOOGLE_CLIENT_SECRET — Desktop client secret (never in the React app)
# INITIAL_ADMIN_GOOGLE_SUB — optional bootstrap admin Google sub
# CORS_ALLOWED_ORIGINS — optional comma-separated browser origins
