name = "classroom-cloud-backup"
main = "src/index.ts"
compatibility_date = "2024-08-15"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "education-2302"
preview_bucket_name = "education-2302"

[[d1_databases]]
binding = "DB"
database_name = "classroom-app"
database_id = "4c53a22f-957b-4411-8ef0-a6673a5c17c7"
migrations_dir = "migrations"

[vars]
DEFAULT_TRIAL_DAYS = "7"
# Optional — worker derives verify key from ENTITLEMENT_PRIVATE_KEY if omitted
ENTITLEMENT_PUBLIC_KEY = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEASva/xyyJL7QpLnWAh3hH6hKb+1DY3GyT9N2ch63ou8c=\n-----END PUBLIC KEY-----"
# GOOGLE_CLIENT_ID = ""
# INITIAL_ADMIN_GOOGLE_SUB = ""

# Secrets (wrangler secret put):
# ENTITLEMENT_PRIVATE_KEY — Ed25519 PKCS#8 PEM
# GOOGLE_CLIENT_ID — same as app OAuth client
# INITIAL_ADMIN_GOOGLE_SUB — optional bootstrap admin Google sub
