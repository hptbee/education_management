name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Future code signing (do not enable until certificates are configured):
# Windows: APPLE_SIGNING_* / TAURI_SIGNING_PRIVATE_KEY for updater
# macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# See docs/build-and-release.md

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.APP_VERSION}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `QuanLyLopHoc v${process.env.APP_VERSION}`,
                body: [
                  'Desktop installers for **Windows** (x64) and **macOS** (Apple Silicon + Intel).',
                  '',
                  '**Unsigned builds:** Windows SmartScreen and macOS Gatekeeper may warn on first launch.',
                  '',
                  'Download the installer or DMG for your platform from the assets below.',
                ].join('\n'),
                draft: true,
                prerelease: false,
              });
              return data.id;
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              return existing.id;
            }

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: windows-x64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macos-x64

    runs-on: ${{ matrix.platform }}
    env:
      NEXT_PUBLIC_CLOUD_BACKUP_URL: ${{ secrets.NEXT_PUBLIC_CLOUD_BACKUP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID_DESKTOP: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID_DESKTOP }}
      NEXT_PUBLIC_ENTITLEMENT_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_ENTITLEMENT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify build secrets
        run: |
          test -n "$NEXT_PUBLIC_CLOUD_BACKUP_URL" || { echo "::error::Missing secret NEXT_PUBLIC_CLOUD_BACKUP_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID" || { echo "::error::Missing secret NEXT_PUBLIC_GOOGLE_CLIENT_ID"; exit 1; }
          test -n "$NEXT_PUBLIC_GOOGLE_CLIENT_ID_DESKTOP" || { echo "::error::Missing secret NEXT_PUBLIC_GOOGLE_CLIENT_ID_DESKTOP"; exit 1; }
          test -n "$NEXT_PUBLIC_ENTITLEMENT_PUBLIC_KEY" || { echo "::error::Missing secret NEXT_PUBLIC_ENTITLEMENT_PUBLIC_KEY"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
